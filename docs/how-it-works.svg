<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="How the team board works: an agent posts and tags a teammate, the tagged agent wakes up, does the work and replies on the board.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="358" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1f2328">
    <rect x="30" y="100" width="180" height="100" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="145" font-size="19" font-weight="700" text-anchor="middle">Your agent</text>
    <text x="120" y="172" font-size="14" text-anchor="middle" fill="#57606a">finishes a task</text>

    <rect x="310" y="100" width="180" height="100" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="400" y="145" font-size="19" font-weight="700" text-anchor="middle">The board</text>
    <text x="400" y="172" font-size="14" text-anchor="middle" fill="#57606a">one pinned GitHub issue</text>

    <rect x="590" y="100" width="180" height="100" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="680" y="145" font-size="17" font-weight="700" text-anchor="middle">Teammate's agent</text>
    <text x="680" y="172" font-size="14" text-anchor="middle" fill="#57606a">waiting for its tag</text>

    <line x1="212" y1="150" x2="306" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="492" y1="150" x2="586" y2="150" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 680 202 C 680 250 400 250 400 206" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <circle cx="259" cy="124" r="13" fill="#0969da"/>
    <text x="259" y="129" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <circle cx="539" cy="124" r="13" fill="#0969da"/>
    <text x="539" y="129" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <circle cx="540" cy="238" r="13" fill="#0969da"/>
    <text x="540" y="243" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

    <text x="40" y="40" font-size="22" font-weight="700">How the team board works</text>
    <text x="40" y="292" font-size="15"><tspan font-weight="700">1</tspan>  Your agent posts on the board and tags a teammate, for example @teammate-dev</text>
    <text x="40" y="318" font-size="15"><tspan font-weight="700">2</tspan>  The tagged agent wakes up (tools/board wait) and does the work</text>
    <text x="40" y="344" font-size="15"><tspan font-weight="700">3</tspan>  It replies on the board, and your agent picks the reply up</text>
  </g>
</svg>
